name: BTH design system sweep

on:
  push:
    branches:
      - design/bth-system-sweep-2026-06-24
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  sweep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/bth-system-sweep-2026-06-24
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply BTH design sweep
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const topLevel = [
            'about.html',
            'addons.html',
            'reset.html',
            'knee.html',
            'mobility.html',
            'bounce.html',
            'tier-1.html',
            'tier-2.html',
            'tier-3.html',
            'updates.html',
            'thank-you.html',
            'join.html',
          ];
          const seoDir = 'seo';
          const seoPages = fs.existsSync(seoDir)
            ? fs.readdirSync(seoDir).filter((name) => name.endsWith('.html')).sort().map((name) => path.posix.join(seoDir, name))
            : [];
          const targetFiles = [...topLevel, ...seoPages];

          function applySweep(relPath, source) {
            let html = source;
            const href = relPath.startsWith('seo/') ? '../assets/bth-system.css' : 'assets/bth-system.css';
            const stylesheet = `<link rel="stylesheet" href="${href}">`;

            if (!html.includes(href)) {
              html = html.replace(/(\n\s*)<style>/, `$1${stylesheet}$1<style>`);
            }

            html = html.replace(/\/\* ─── BRAND TOKENS \(shared with site\) ─── \*\/\s*/g, '/* ─── PAGE-SPECIFIC TOKENS ─── */\n');

            html = html.replace(/:root\s*\{[\s\S]*?\}/g, (block) => {
              const brandTokens = ['--cream', '--white', '--black', '--gold', '--muted', '--border', '--soft', '--H', '--B'];
              const hasFullBrandTokenSet = brandTokens.every((token) => block.includes(token));
              if (!hasFullBrandTokenSet) return block;

              const hasColorScheme = /color-scheme\s*:\s*light only/.test(block);
              const hasGreen = /--green\s*:\s*#1F8A4C/i.test(block);

              if (hasColorScheme && hasGreen) return ':root { color-scheme: light only; --green:#1F8A4C; }';
              if (hasColorScheme) return ':root { color-scheme: light only; }';
              if (hasGreen) return ':root { --green:#1F8A4C; }';
              return '';
            });

            html = html.replace(/\n{4,}/g, '\n\n\n');
            html = html.replace(/border-radius:12px;padding:20px 24px;box-shadow:0 8px 32px rgba\(0,0,0,0\.6\);/g, 'border-radius:2px;padding:20px 24px;');
            return html;
          }

          const results = [];
          for (const relPath of targetFiles) {
            const before = fs.readFileSync(relPath, 'utf8');
            const after = applySweep(relPath, before);
            if (before !== after) fs.writeFileSync(relPath, after, 'utf8');

            const href = relPath.startsWith('seo/') ? '../assets/bth-system.css' : 'assets/bth-system.css';
            const duplicateBrandTokens = /--cream\s*:\s*#F3EFE7|--white\s*:\s*#FFFFFF|--black\s*:\s*#111318|--gold\s*:\s*#E6A800|--H\s*:\s*'Oswald'|--B\s*:\s*'DM Sans'/.test(after);
            const badPromo = /border-radius:12px|box-shadow:0 8px 32px rgba\(0,0,0,0\.6\)/.test(after);
            const ok = after.includes(href) && /color-scheme\s*:\s*light only/.test(after) && !duplicateBrandTokens && !badPromo;
            results.push({ relPath, changed: before !== after, ok });
          }

          const failed = results.filter((row) => !row.ok);
          console.table(results);
          if (failed.length) {
            console.error('Sweep verification failed:', failed);
            process.exit(1);
          }
          NODE
      - name: Commit sweep and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bth-design-system-sweep.yml
          git add about.html addons.html reset.html knee.html mobility.html bounce.html tier-1.html tier-2.html tier-3.html updates.html thank-you.html join.html seo/*.html
          git add -u .github/workflows/bth-design-system-sweep.yml
          if git diff --cached --quiet; then
            echo "No sweep changes to commit."
            exit 0
          fi
          git commit -m "Apply BTH shared design system sweep"
          git push origin HEAD:design/bth-system-sweep-2026-06-24
