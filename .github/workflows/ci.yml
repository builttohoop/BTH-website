name: CI
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check JS files
        run: |
          for f in assets/bth-tracking.js assets/bth-click-id.js bth-operator-sw.js \
                   BTH-Operator.inline.js email-sequences/generate-html-emails.mjs; do
            [ -f "$f" ] && node --check "$f" && echo "✓ $f"
          done

      - name: Syntax-check gate scripts
        run: |
          for f in .github/scripts/*.mjs; do node --check "$f" && echo "✓ $f"; done

      - name: Validate JSON files
        run: |
          find . -name "*.json" \
            ! -path "*/.git/*" ! -path "*/node_modules/*" ! -path "*/reset-pdfs/node_modules/*" \
          | while IFS= read -r f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" \
              && echo "✓ $f" || exit 1
          done

      - name: Internal link integrity
        run: node .github/scripts/check-links.mjs

      # BTH-GOAL-0057 D7. The client_reference_id shape is a contract with the Mail OS
      # worker's parser, in a different repo — the two halves ship as two separate merges,
      # so nothing else would catch a drift until an abandoned checkout silently went
      # anonymous again. This runs the real function out of assets/bth-click-id.js.
      - name: client_reference_id shape (abandoned-checkout identity)
        run: node .github/scripts/check-client-reference.mjs

  # Its OWN required check, independent of the gate. A secret or member PII in a diff
  # blocks the merge whether or not anyone approves it. This is the check that was
  # sitting unwired on disk while every push went unscanned.
  leak-scan:
    name: leak-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch base
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
      - name: Scan the diff for secrets, tokens, keys and member PII
        run: |
          node .github/scripts/leak-scan.mjs \
            --repo . \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"
