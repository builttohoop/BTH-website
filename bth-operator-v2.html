<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BTH Operator">
  <meta name="theme-color" content="#111318">
  <title>BTH Operator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='2' fill='%23111318'/%3E%3Cpath d='M10 14h44v8H36v30h-8V22H10z' fill='%23E6A800'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
  (function(){
    var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="2" fill="#111318"/><path d="M22 30h84v12H72v58H56V42H22z" fill="#E6A800"/></svg>';
    var m={name:'BTH Operator',short_name:'BTH',start_url:'./bth-operator-v2.html',scope:'./',display:'standalone',background_color:'#F3EFE7',theme_color:'#111318',icons:[{src:'data:image/svg+xml,'+encodeURIComponent(svg),sizes:'any',type:'image/svg+xml',purpose:'any maskable'}]};

  <style>
    :root {
      --black:#111318; --gold:#E6A800; --gold-dim:#E6A800; --gold-text:#7A5700; --gold-bg:rgba(230,168,0,.10);
      --white:#F3EFE7; --dark:#FFFFFF; --mid:#F3EFE7; --gray:rgba(17,19,24,.16); --muted:rgba(17,19,24,.66);
      --ink:#111318; --band:#111318; --on-band:#F3EFE7; --on-gold:#111318;
      --nav-h:68px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,44px);
      color-scheme:light;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --white:#0E0F13; --dark:#1A1C22; --mid:#24272E; --gray:rgba(243,239,231,.16); --muted:rgba(243,239,231,.66);
        --ink:#F3EFE7; --band:#07080A; --gold-text:#E6A800; --gold-bg:rgba(230,168,0,.14);
        color-scheme:dark;
      }
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    ::placeholder{color:var(--muted);opacity:1;}
    html,body{height:100%;overflow:hidden;background:var(--white);color:var(--ink);font-family:'DM Sans',sans-serif;}
    @keyframes tabIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--sb));padding-bottom:var(--sb);background:var(--band);border-top:3px solid var(--gold);box-shadow:none;display:flex;align-items:center;z-index:100;}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.52);transition:color .18s;}
    .nav-btn.active{color:var(--gold);}
    .nav-icon{font-size:20px;transition:transform .2s;}
    .nav-btn.active .nav-icon{transform:translateY(-1px);}
    .nav-label{font-family:'DM Sans',sans-serif;font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;}
    .tab{position:fixed;top:0;left:0;right:0;bottom:calc(var(--nav-h) + var(--sb));overflow-y:auto;overflow-x:hidden;padding:calc(var(--st) + 20px) 16px 32px;display:none;-webkit-overflow-scrolling:touch;background:var(--white);}
    .tab.active{display:block;animation:tabIn .2s ease;}
    .page-title{font-family:'Oswald',sans-serif;font-size:42px;font-weight:700;line-height:.95;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);}
    .page-sub{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.08em;text-transform:uppercase;}
    .page-head{margin:-2px 0 28px;padding-bottom:20px;border-bottom:3px solid var(--gold);}
    .section-label{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
    .card{background:var(--dark);border:1px solid var(--gray);border-left:3px solid var(--ink);border-radius:2px;padding:18px 16px;margin-bottom:12px;animation:cardIn .2s ease both;box-shadow:none;}
    .card-title{font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;color:var(--ink);margin-bottom:10px;letter-spacing:.08em;text-transform:uppercase;}
    .input-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray);}
    .input-row:last-child{border-bottom:none;}
    .input-label{font-size:14px;font-weight:500;color:var(--ink);}
    .input-sub{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--muted);}
    .num-input{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:var(--gold-text);background:none;border:none;outline:none;width:70px;text-align:right;-webkit-appearance:none;}
    .num-input::placeholder{color:var(--muted);font-size:14px;}
    .bar-wrap{height:4px;background:var(--gray);border-radius:2px;overflow:hidden;margin-top:6px;}
    .bar-fill{height:100%;border-radius:2px;transition:width .4s ease,background .3s ease;}
    .bar-gold,.bar-green,.bar-blue,.bar-red{background:var(--gold);}
    .btch-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .btch-item{display:flex;align-items:center;gap:8px;background:var(--mid);border:1px solid var(--gray);border-radius:2px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s;}
    .btch-item.done{border-color:var(--gold);background:var(--gold-bg);}
    .btch-icon{font-size:16px;flex-shrink:0;}.btch-label{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:.2px;color:var(--ink);}
    .btch-check{margin-left:auto;font-size:14px;color:var(--muted);}
    .btch-item.done .btch-check{color:var(--gold-text);}
    .btch-all-done{background:var(--gold);border:2px solid var(--gold);border-radius:2px;padding:12px 16px;margin-bottom:10px;text-align:center;font-weight:900;font-size:14px;letter-spacing:1px;color:var(--on-gold);display:none;}
    .task-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--gray);}
    .task-item:last-child{border-bottom:none;}
    .task-check{width:22px;height:22px;border-radius:2px;border:2px solid var(--muted);background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:border-color .2s,background .2s;font-size:13px;color:transparent;}
    .task-check.done{border-color:var(--gold);background:var(--gold);color:var(--on-gold);}
    .task-text{font-size:13px;flex:1;}.task-text.done{text-decoration:line-through;color:var(--muted);}
    .collapsible-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0;user-select:none;}
    .collapsible-arrow{font-size:12px;color:var(--muted);transition:transform .25s;}
    .collapsible-body{overflow:hidden;transition:max-height .35s ease;max-height:0;}
    .collapsible-body.open{max-height:3000px;}
    .collapsible-header.open .collapsible-arrow{transform:rotate(180deg);}
    .sched-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray);}
    .sched-item:last-child{border-bottom:none;}
    .sched-time{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--gold-text);min-width:54px;cursor:pointer;border:none;background:none;outline:none;-webkit-appearance:none;}
    .sched-label{font-size:14px;font-weight:500;color:var(--ink);flex:1;}
    .pip-row{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
    .pip-dot{width:30px;height:30px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;border:2px solid var(--gray);color:var(--muted);}
    .pip-dot.done{background:var(--gold);border-color:var(--gold);color:var(--on-gold);}
    .pip-dot.today{border-color:var(--gold);color:var(--gold-text);}
    .pip-dot.rest{background:var(--gray);border-color:var(--gray);color:var(--muted);}
    .streak-stat{text-align:center;flex:1;}
    .streak-num{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;color:var(--gold-text);}
    .streak-label{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.5px;text-transform:uppercase;}
    .grade-card{text-align:center;padding:24px 16px;}
    .grade-letter{font-family:'Oswald',sans-serif;font-size:80px;font-weight:700;line-height:1;}

    .btch-item,.task-check,.collapsible-header,.yesterday-back,[role="button"]{min-width:44px;min-height:44px;}
    [role="button"]{display:inline-flex;align-items:center;justify-content:center;}
    .collapsible-header,.btch-item{display:flex;}
    button.btch-item,button.task-check,button.collapsible-header{font:inherit;color:inherit;text-align:left;}
    button.btch-item{width:100%;}
    button.task-check{padding:0;text-align:center;flex:0 0 44px;}
    button.collapsible-header{width:100%;border:0;background:transparent;padding:0;}
    .grade-score{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);margin-top:6px;}
    .grade-breakdown{display:flex;margin-top:16px;border-top:1px solid var(--gray);}
    .grade-item{flex:1;text-align:center;padding:10px 4px;border-right:1px solid var(--gray);}
    .grade-item:last-child{border-right:none;}
    .grade-item-val{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:var(--ink);}
    .grade-item-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
    .week-day-selector{display:flex;gap:6px;margin-bottom:14px;}
    .sel-btn{flex:1;min-height:44px;padding:8px 4px;text-align:center;border-radius:2px;border:1px solid var(--gray);background:var(--mid);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s;}
    .sel-btn.active{border-color:var(--gold);color:var(--gold-text);background:var(--gold-bg);}
    .exercise-row{padding:13px 0;border-bottom:1px solid var(--gray);animation:cardIn .2s ease both;}
    .exercise-row:last-child{border-bottom:none;}
    .ex-name{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px;}
    .ex-week{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:13px;color:var(--gold-text);}
    .ex-rest{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:10px;color:var(--muted);margin-top:4px;}
    .warmup-item{font-size:12px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--gray);}
    .warmup-item:last-child{border-bottom:none;}
    .intent-badge{display:inline-block;padding:4px 12px;border-radius:2px;background:var(--gold-bg);border:1px solid var(--gold);font-size:11px;color:var(--gold-text);font-weight:700;letter-spacing:.5px;margin-bottom:6px;}
    .intent-feel{font-size:12px;color:var(--muted);font-style:italic;}
    .goal-edit-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray);}
    .goal-edit-row:last-child{border-bottom:none;}
    .goal-label{font-size:14px;font-weight:500;color:var(--ink);}
    .goal-input{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--gold-text);background:none;border:none;outline:none;width:70px;text-align:right;-webkit-appearance:none;}
    .week-day-bar{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--gray);}
    .week-day-bar:last-child{border-bottom:none;}
    .wdb-label{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:10px;color:var(--muted);width:28px;}
    .wdb-bar{flex:1;height:6px;background:var(--gray);border-radius:2px;overflow:hidden;}
    .wdb-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s;}
    .wdb-val{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:10px;color:var(--muted);width:36px;text-align:right;}
    .note-item{background:var(--mid);border:1px solid var(--gray);border-radius:2px;padding:12px;margin-bottom:8px;animation:cardIn .2s ease both;}
    .note-text{font-size:14px;color:var(--ink);line-height:1.55;white-space:pre-wrap;}
    .note-ts{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:10px;color:var(--muted);margin-top:6px;}
    .note-delete{float:right;font-size:12px;color:var(--muted);cursor:pointer;margin-left:8px;}
    .note-textarea{width:100%;background:var(--mid);border:1px solid var(--gray);border-radius:2px;padding:12px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;resize:none;outline:none;min-height:82px;transition:border-color .2s;display:block;}
    .note-textarea:focus{border-color:var(--gold);}
    .btn-primary{width:100%;padding:15px;background:var(--gold);border:2px solid var(--gold);border-radius:2px;font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-gold);cursor:pointer;transition:transform .1s,opacity .1s;}
    .btn-primary:active{transform:scale(.97);}
    .btn-secondary{width:100%;padding:12px;background:none;border:2px solid var(--ink);border-radius:2px;font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);cursor:pointer;transition:border-color .2s,color .2s;margin-top:8px;}
    .btn-secondary:active{border-color:var(--gold);color:var(--gold-text);}
    .ex-input{flex:1;background:var(--mid);border:1px solid var(--gray);border-radius:2px;padding:8px 10px;color:var(--ink);font-size:13px;outline:none;font-family:'DM Sans',sans-serif;}
    .ex-input:focus{border-color:var(--gold);}.ex-input-sm{width:76px;flex:none;}
    .ex-input-row{display:flex;gap:8px;margin-bottom:6px;}
    .added-ex{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--gray);}
    .added-ex:last-child{border-bottom:none;}
    .added-ex-name{font-size:13px;font-weight:500;color:var(--ink);}
    .added-ex-sets{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:10px;color:var(--muted);}
    .added-ex-del{font-size:12px;color:var(--muted);cursor:pointer;padding:4px;}
    .toast-el{position:fixed;bottom:calc(var(--nav-h) + var(--sb) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--band);color:var(--on-band);padding:10px 20px;border:2px solid var(--gold);border-radius:2px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999;white-space:nowrap;}
    .toast-el.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .yesterday-banner{background:var(--gold-bg);border:1px solid var(--gold);border-radius:2px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
    .yesterday-text{font-size:12px;color:var(--gold-text);font-weight:700;}
    .yesterday-back{font-size:11px;color:var(--muted);cursor:pointer;}
    #today-micro{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;font-weight:500;}
    .divider{height:1px;background:var(--gray);margin:14px 0;}
    .no-data{text-align:center;padding:32px 16px;color:var(--muted);font-size:13px;}
    .no-data-icon{font-size:32px;margin-bottom:8px;}
    .btch-item,.sel-btn,.ex-input,.note-item,.yesterday-banner,.intent-badge{border-radius:2px;box-shadow:none;}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(230,168,0,.38);outline-offset:2px;}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}
    ::-webkit-scrollbar{display:none;}
    /* Ty Week + Money (round 2) */
    .tw-tabs{display:flex;gap:6px;margin-bottom:16px;}
    .tw-weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
    .tw-arrow{width:44px;height:44px;flex:none;border:1px solid var(--gray);background:var(--dark);color:var(--ink);border-radius:2px;font-size:18px;font-weight:700;cursor:pointer;}
    .tw-arrow:disabled{opacity:.35;cursor:default;}
    .tw-range{flex:1;text-align:center;font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);}
    .tw-big{font-family:'Oswald',sans-serif;font-size:44px;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
    .tw-big-sub{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums;}
    .tw-bar{height:8px;background:var(--gray);border-radius:2px;overflow:hidden;margin-top:12px;}
    .tw-bar-fill{height:100%;background:var(--gold);transition:width .4s ease;}
    .tw-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px;}
    .tw-day{min-height:56px;padding:6px 0;border:1px solid var(--gray);background:var(--dark);border-radius:2px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:'DM Sans',sans-serif;}
    .tw-day .tw-dname{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
    .tw-day .tw-dcount{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
    .tw-day.today{box-shadow:inset 0 3px 0 var(--gold);}
    .tw-day.full{background:var(--gold);border-color:var(--gold);color:var(--on-gold);}
    .tw-day.full .tw-dcount{color:var(--on-gold);}
    .tw-day.sel{outline:2px solid var(--ink);outline-offset:-2px;}
    .tw-time{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;}
    .tw-count{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
    .tw-count.hit{color:var(--gold-text);}
    .tw-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--gray);}
    .tw-row:last-child{border-bottom:none;}
    .tw-input{flex:1;min-width:0;min-height:44px;background:var(--mid);border:1px solid var(--gray);border-radius:2px;padding:8px 10px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;}
    .tw-input:focus{border-color:var(--gold);}
    .tw-input.sm{flex:none;width:96px;}
    .tw-input.time{flex:none;width:132px;padding:8px 6px;}
    .tw-chips{display:flex;gap:3px;margin:8px 0 2px;}
    .tw-chip{flex:1;min-width:0;min-height:44px;border:1px solid var(--gray);background:var(--mid);color:var(--muted);border-radius:2px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
    .tw-chip.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold);}
    .tw-del,.tw-step{width:44px;height:44px;flex:none;border:1px solid var(--gray);background:var(--dark);color:var(--ink);border-radius:2px;font-size:16px;font-weight:700;cursor:pointer;}
    .tw-del{border-color:transparent;background:none;color:var(--muted);}
    .tw-item{padding:12px 0;border-bottom:1px solid var(--gray);}
    .tw-item:last-child{border-bottom:none;}
    .tw-note{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
    .tw-link{display:block;width:100%;min-height:44px;background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;text-decoration:underline;cursor:pointer;}
    .tw-amt{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
    .tw-sum{display:flex;align-items:center;gap:12px;}
    .tw-sum-main{flex:1;min-width:0;}
    .tw-sum-go{font-size:22px;color:var(--muted);}
    .tw-hrs{flex:none;width:72px;text-align:center;}
    .tw-hmain{flex:1;min-width:0;}
    .task-item .tw-count{min-width:76px;text-align:right;}
  </style>
</head>
<body>
<div id="tab-today" class="tab active"></div>

function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function tyNow(){var d=new Date();if(d.getHours()<6)d.setDate(d.getDate()-1);return d;}
function dateKey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function todayKey(){return dateKey(tyNow());}
function yesterdayKey(){var d=tyNow();d.setDate(d.getDate()-1);return dateKey(d);}
function weekKeys(){var d=tyNow(),day=d.getDay(),keys=[];for(var i=1;i<=7;i++){var t=new Date(d);t.setDate(d.getDate()-(day===0?7:day)+i);keys.push(dateKey(t));}return keys;}
function formatDayLabel(key){var p=key.split('-').map(Number),dt=new Date(p[0],p[1]-1,p[2]);return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];}
function formatDate(d){var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return days[d.getDay()]+', '+months[d.getMonth()]+' '+d.getDate();}
function formatNoteTs(ts){try{var d=new Date(ts);return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}catch(e){return ts;}}
var OPERATOR_STATE_KEY='bth_operator_state_v3';
function operatorDayId(){return'op-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);}
function initOperatorState(){
  var state=load(OPERATOR_STATE_KEY);
  if(state&&state.version===3&&state.activeDayId&&state.days&&state.days[state.activeDayId])return state;
  var id=operatorDayId(),label=todayKey();
  state={version:3,activeDayId:id,order:[id],days:{},reminders:{fired:{}}};
  state.days[id]={id:id,labelDate:label,createdAt:new Date().toISOString(),submitted:false,submittedAt:null,log:load('bth_d_'+label)||{},tasks:load('bth_t_'+label)||null};
  save(OPERATOR_STATE_KEY,state);return state;
}
var OPERATOR_STATE=initOperatorState();
function persistOperator(){save(OPERATOR_STATE_KEY,OPERATOR_STATE);}
function findOperatorDay(ref){
  if(OPERATOR_STATE.days[ref])return OPERATOR_STATE.days[ref];
  for(var i=OPERATOR_STATE.order.length-1;i>=0;i--){var d=OPERATOR_STATE.days[OPERATOR_STATE.order[i]];if(d&&d.labelDate===ref)return d;}
  return null;
}
function ensureOperatorDay(label){
  var existing=findOperatorDay(label);if(existing)return existing;
  var id=operatorDayId(),day={id:id,labelDate:label,createdAt:new Date().toISOString(),submitted:false,submittedAt:null,log:load('bth_d_'+label)||{},tasks:load('bth_t_'+label)||null};
  OPERATOR_STATE.days[id]=day;OPERATOR_STATE.order.push(id);persistOperator();return day;
}
function operatorDate(ref){var day=findOperatorDay(ref),key=day?day.labelDate:ref,p=String(key).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function getLog(key){var day=findOperatorDay(key);return day?day.log:(load('bth_d_'+key)||{});}
function setLog(key,data){var day=findOperatorDay(key);if(day){day.log=data;persistOperator();}else save('bth_d_'+key,data);}
function getTasks(key){var day=findOperatorDay(key);return day?day.tasks:(load('bth_t_'+key)||null);}
function setTasks(key,data){var day=findOperatorDay(key);if(day){day.tasks=data;persistOperator();}else save('bth_t_'+key,data);}
function getGoals(){return Object.assign({},DEFAULT_GOALS,load('bth_goals')||{});}
function getSchedule(){return load('bth_schedule')||DEFAULT_SCHEDULE.map(function(s){return Object.assign({},s);});}
function scoreDay(d){
  if(!d||!Object.keys(d).length)return null;
  var pts=0,goals=getGoals(),sl=parseFloat(d.sleep)||0,en=parseInt(d.energy)||0;
  pts+=Math.min(20,(sl/8)*20);pts+=Math.min(10,(en/7)*10);
  BTH_ITEMS.forEach(function(it){if(d[it.key])pts+=5;});
  if(d.gym)pts+=20;else if(!d.working)pts+=10;
  pts+=Math.min(1,(parseFloat(d.protein)||0)/goals.protein)*15;
  pts+=Math.min(1,(parseFloat(d.water)||0)/goals.water)*5;
  return Math.round(Math.min(100,pts));
}
function scoreToGrade(s){if(s===null)return null;if(s>=93)return'A+';if(s>=90)return'A';if(s>=87)return'A-';if(s>=83)return'B+';if(s>=80)return'B';if(s>=77)return'B-';if(s>=73)return'C+';if(s>=70)return'C';if(s>=67)return'C-';if(s>=60)return'D';return'F';}
function calcStreak(fn){var streak=0,d=tyNow();for(var i=0;i<90;i++){var k=dateKey(d),lg=getLog(k);if(!lg||!Object.keys(lg).length)break;if(!fn(lg))break;streak++;d.setDate(d.getDate()-1);}return streak;}
function bthStreak(){return calcStreak(function(l){return BTH_ITEMS.every(function(it){return l[it.key];});});}
function gymStreak(){return calcStreak(function(l){return!!l.gym;});}
function readStreak(){return calcStreak(function(l){return!!l.reading;});}

  html+='<div class="card"><div class="tw-big">'+twFmt(tot)+'</div><div class="tw-big-sub">of '+twFmt(goal)+' · '+(tot>=goal?'goal hit':twFmt(goal-tot)+' to go')+'</div><div class="tw-bar"><div class="tw-bar-fill" style="width:'+pct+'%"></div></div><button class="tw-link" style="text-align:left;margin-top:6px;" onclick="twMoneyEdit(true)">Edit goal</button></div>';
  html+='<div class="card"><div class="card-title">LOG MONEY</div><div style="display:flex;gap:6px;margin-bottom:12px;"><input class="tw-input sm" id="tw-amt" type="number" inputmode="decimal" step="any" placeholder="$" aria-label="Amount in dollars"><input class="tw-input" id="tw-note" placeholder="What for (optional)" aria-label="What it was for"></div><button class="btn-primary" onclick="twAddMoney()">ADD ENTRY</button></div>';
  html+='<div class="card"><div class="card-title">'+(twOffset===0?'THIS WEEK':'THAT WEEK')+'</div>';
  if(!w.money.length)html+='<div class="tw-note" style="margin:0;">Nothing logged yet.</div>';
  [].concat(w.money).reverse().forEach(function(e){html+='<div class="tw-row"><div style="flex:1;min-width:0;"><div class="input-label">'+esc(e.note||'Entry')+'</div><div class="input-sub">'+twEntryDate(e.ts)+'</div></div><div class="tw-amt">'+twFmt(e.amt)+'</div><button class="tw-del" aria-label="Delete '+esc(e.note||'entry')+'" onclick="twDelMoney(\''+e.id+'\')">✕</button></div>';});
  return html+'</div>';
}
function twMoneyEdit(on){twMoneyEditing=!!on;renderWeek();}
function twSetMoneyGoal(){var el=document.getElementById('tw-money-goal'),v=parseFloat(el.value);if(!(v>0)){toast('Enter a goal above $0');el.focus();return;}TW.moneyGoal=Math.round(v*100)/100;twMoneyEditing=false;twSave();renderWeek();toast('Money goal saved');}
function twAddMoney(){var a=document.getElementById('tw-amt'),n=document.getElementById('tw-note'),v=parseFloat(a.value);if(!v){toast('Enter an amount');a.focus();return;}var w=twWeek(twOffset,true);w.money.push({id:twId('e'),amt:Math.round(v*100)/100,note:(n.value||'').trim(),ts:new Date().toISOString()});twSave();renderWeek();toast('Logged '+twFmt(v));}
function twDelMoney(id){var w=twWeek(twOffset,true),e=twFind(w.money,id);if(!e||!confirm('Delete '+twFmt(e.amt)+(e.note?' ('+e.note+')':'')+'?'))return;w.money=w.money.filter(function(x){return x.id!==id;});twSave();renderWeek();}
function twTodayCardHtml(){
  var sub;
  if(!twIsSetUp()&&TW.moneyGoal===null)sub='Set up your week';
  else{var w=twWeek(0,false),ds=twDayStats(w,twTodayIdx()),ws=twWeekStats(w),parts=[];if(twIsSetUp()){if(ds.total)parts.push('Today '+ds.done+'/'+ds.total);parts.push('Week '+ws.pct+'%');}if(TW.moneyGoal!==null)parts.push(twFmt(twMoneyTotal(w))+' of '+twFmt(TW.moneyGoal));sub=parts.join(' · ');}
  return'<button class="card tw-sum" style="width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;border-left-color:var(--gold);" onclick="openTyWeek()"><div class="tw-sum-main"><div class="card-title" style="margin:0 0 2px;">TY WEEK</div><div class="input-sub" style="font-size:12px;">'+sub+'</div></div><div class="tw-sum-go" aria-hidden="true">›</div></button>';
}
function openTyWeek(){twView='week';twOffset=0;twDay=twTodayIdx();switchTab('week',document.querySelectorAll('.nav-btn')[3]);}
function renderClaude(){
  var email=load('bth_email')||'',notes=load('bth_claude_notes')||[];
  var html='<div class="page-head"><div class="page-title">CLAUDE</div><div class="page-sub">Notes · Questions · Email updates</div></div>';
  html+='<div class="card"><div class="card-title">PUSH TO CLAUDE</div><textarea class="note-textarea" id="claude-note-input" placeholder="Drop a thought, question, or update for Claude..."></textarea><button class="btn-primary" style="margin-top:10px;" onclick="saveClaudeNote()">SEND TO CLAUDE</button></div>';
  if(notes.length){html+='<div class="section-label">SAVED NOTES ('+notes.length+')</div>';[].concat(notes).reverse().forEach(function(n,i){var realIdx=notes.length-1-i;html+='<div class="note-item"><span class="note-delete" onclick="deleteClaudeNote('+realIdx+')">✕</span><div class="note-text">'+esc(n.text)+'</div><div class="note-ts">'+formatNoteTs(n.ts)+'</div></div>';});html+='<button class="btn-secondary" onclick="clearAllNotes()">Clear all notes</button>';}
  html+='<div class="divider"></div>';
  html+='<div class="card"><div class="card-title">EMAIL UPDATES</div><div class="input-row"><div class="input-label">Your email</div><input type="email" id="bth-email-input" style="background:none;border:none;outline:none;font-family:\'DM Sans\',sans-serif;font-size:13px;font-weight:500;color:var(--gold-text);text-align:right;width:170px;" placeholder="your email" value="'+esc(email)+'" oninput="save(\'bth_email\',this.value)"></div><div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;"><button class="btn-primary" onclick="sendDailyReport()">SEND TODAY\'S REPORT</button><button class="btn-secondary" onclick="sendCheckIn()">SEND CHECK-IN REMINDER</button></div><div style="margin-top:10px;font-family:\'DM Sans\',sans-serif;font-size:11px;color:var(--muted);line-height:1.7;">Opens your mail app pre-filled.<br>Hit send from there.</div></div>';
  html+='<div class="card"><div class="card-title">OPERATOR TOOLS</div><div class="input-sub" id="pwa-status" style="line-height:1.6;margin-bottom:12px;">Installable PWA · active-day storage · offline shell</div><button class="btn-primary" onclick="enableNotifications()">ENABLE REMINDERS</button><button class="btn-secondary" onclick="downloadICS()">CALENDAR (.ICS)</button><button class="btn-secondary" onclick="exportCSV()">EXPORT ALL DATA (CSV)</button><button class="btn-secondary" onclick="downloadClaudeHandoff()">CLAUDE HANDOFF (JSON)</button></div>';
  document.getElementById('tab-claude').innerHTML=html;
  renderPwaStatus();
}
function saveClaudeNote(){var input=document.getElementById('claude-note-input'),text=(input&&input.value||'').trim();if(!text){toast('Write something first');return;}var notes=load('bth_claude_notes')||[];notes.push({text:text,ts:new Date().toISOString()});save('bth_claude_notes',notes);input.value='';toast('Saved ✓');renderClaude();}
function deleteClaudeNote(i){var n=load('bth_claude_notes')||[];n.splice(i,1);save('bth_claude_notes',n);renderClaude();}
function clearAllNotes(){save('bth_claude_notes',[]);renderClaude();}
function sendDailyReport(){
  var email=load('bth_email');if(!email){toast('Add your email first');return;}
  var log=getLog(OPERATOR_STATE.activeDayId),goals=getGoals(),activeDay=findOperatorDay(OPERATOR_STATE.activeDayId);
  var bthDone=BTH_ITEMS.filter(function(it){return log[it.key];}).map(function(it){return it.label;}).join(', ')||'None';
  var sc=scoreDay(log),grade=sc!==null?(scoreToGrade(sc)+' ('+sc+'/100)'):'No data yet';
  var notesList=(load('bth_claude_notes')||[]).map(function(n){return n.text;}).join('\n\n---\n\n')||'None';
  var subj='BTH Operator — Daily Report '+activeDay.labelDate;
  var body='BTH OPERATOR — DAILY REPORT\nOperator day: '+activeDay.labelDate+'\nGrade: '+grade+'\n\nSLEEP + ENERGY\nSleep: '+(log.sleep||'—')+'h\nEnergy: '+(log.energy||'—')+'/7\nWater: '+(log.water||'—')+' glasses\n\nNUTRITION\nProtein: '+(log.protein||'—')+'g / '+goals.protein+'g\nCarbs: '+(log.carbs||'—')+'g / '+goals.carbs+'g\nFat: '+(log.fat||'—')+'g / '+goals.fat+'g\nCals: '+(log.cals||'—')+' / '+goals.cals+'\n\nBTH CHECKLIST\n'+bthDone+'\n\nGYM: '+(log.gym?'Done':'Not logged')+'\nREADING: '+(log.reading?'Done':'Not logged')+'\n\nNOTES FOR CLAUDE:\n'+notesList+'\n\n— Sent from BTH Operator';
  window.location.href='mailto:'+email+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
}
function sendCheckIn(){
  var email=load('bth_email');if(!email){toast('Add your email first');return;}
  var log=getLog(OPERATOR_STATE.activeDayId),hasData=Object.keys(log).length>0,activeDay=findOperatorDay(OPERATOR_STATE.activeDayId);
  var subj=hasData?'BTH — Check in '+activeDay.labelDate:'BTH — No logs this operator day, you good?';
  var body=hasData?'Quick check-in from BTH Operator.\n\nSleep: '+(log.sleep||'—')+'h  ·  Energy: '+(log.energy||'—')+'/7  ·  BTH: '+BTH_ITEMS.filter(function(it){return log[it.key];}).length+'/6\n\nGrade: '+scoreToGrade(scoreDay(log))+'\n\nLog the work. Keep your body ready.\n— BTH Operator':'Hey — no logs yet today in BTH Operator.\n\nYou good?\n\nOpen the app and log something. Even just sleep + energy counts.\n\n— BTH System';
  window.location.href='mailto:'+email+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
}
function downloadFile(name,content,type){var blob=new Blob([content],{type:type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCSV(){
  var cols=['operator_day_id','label_date','created_at','submitted_at','sleep','energy','water','protein','carbs','fat','calories','gym','reading','working','posted','filmed','edited','engaged','planned','recovery'];
  var rows=[cols.join(',')];OPERATOR_STATE.order.forEach(function(id){var d=OPERATOR_STATE.days[id];if(!d)return;var l=d.log||{};rows.push([id,d.labelDate,d.createdAt,d.submittedAt||'',l.sleep,l.energy,l.water,l.protein,l.carbs,l.fat,l.cals,l.gym,l.reading,l.working,l.posted,l.filmed,l.edited,l.engaged,l.planned,l.recovery].map(csvCell).join(','));});
  var weekKeysTW=Object.keys(TW.weeks).sort(function(a,b){return twKeyTime(a)-twKeyTime(b);});
  rows.push('');rows.push(['ty_week_of','day','type','item','time','done','target','unit'].join(','));
  weekKeysTW.forEach(function(k){var w=TW.weeks[k];w.checks=w.checks||{};for(var i=0;i<7;i++){twGoalsFor(i).forEach(function(g){rows.push([k,TW_DAYS[i],'goal',g.label,g.time||'',twChecked(w,i,g.id)?1:0,'',''].map(csvCell).join(','));});}var off=Math.round((twKeyTime(k)-twKeyTime(twWeekKey(0)))/(7*864e5));w.hours=w.hours||{};TW.minimums.forEach(function(m){rows.push([k,'','minimum',m.label,'',twMinValue(w,m),twMinTarget(m,off),m.unit==='hrs'?'hrs':'times'].map(csvCell).join(','));});});
  rows.push('');rows.push(['money_week_of','logged_at','amount','note','weekly_goal'].join(','));
  weekKeysTW.forEach(function(k){(TW.weeks[k].money||[]).forEach(function(e){rows.push([k,e.ts,e.amt,e.note||'',TW.moneyGoal===null?'':TW.moneyGoal].map(csvCell).join(','));});});
  downloadFile('bth-operator-export.csv',rows.join('\n'),'text/csv;charset=utf-8');toast('CSV ready');
}
function pad(n){return String(n).padStart(2,'0');}
function icsDate(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';}
function icsSafe(v){return String(v).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function downloadICS(){
  var base=operatorDate(OPERATOR_STATE.activeDayId),sched=getSchedule(),body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Built to Hoop//BTH Operator//EN','CALSCALE:GREGORIAN'];
  sched.forEach(function(item){var p=item.time.split(':').map(Number),start=new Date(base);start.setHours(p[0],p[1],0,0);var end=new Date(start.getTime()+30*60000);body.push('BEGIN:VEVENT','UID:'+OPERATOR_STATE.activeDayId+'-'+item.id+'@built-to-hoop.com','DTSTAMP:'+icsDate(new Date()),'DTSTART:'+icsDate(start),'DTEND:'+icsDate(end),'SUMMARY:'+icsSafe(item.label),'DESCRIPTION:BTH Operator schedule','END:VEVENT');});
  body.push('END:VCALENDAR');downloadFile('bth-operator-schedule.ics',body.join('\r\n'),'text/calendar;charset=utf-8');toast('Calendar ready');
}
function downloadClaudeHandoff(){var day=findOperatorDay(OPERATOR_STATE.activeDayId),packet={source:'BTH Operator',exportedAt:new Date().toISOString(),activeDayId:day.id,labelDate:day.labelDate,log:day.log,tasks:day.tasks,notes:load('bth_claude_notes')||[],tyWeek:TW};downloadFile('bth-operator-claude-handoff.json',JSON.stringify(packet,null,2),'application/json');toast('Claude handoff ready');}
function enableNotifications(){if(!('Notification'in window)){toast('Notifications not supported here');return;}Notification.requestPermission().then(function(p){save('bth_notifications_enabled',p==='granted');renderPwaStatus();toast(p==='granted'?'Reminders on':'Permission: '+p);});}
function notify(title,body){try{if(load('bth_notifications_enabled')&&Notification.permission==='granted')new Notification(title,{body:body,tag:'bth-'+OPERATOR_STATE.activeDayId});}catch(e){}}
function reminderTick(){var now=new Date(),hhmm=pad(now.getHours())+':'+pad(now.getMinutes()),fired=OPERATOR_STATE.reminders.fired||{};getSchedule().forEach(function(item){var key=OPERATOR_STATE.activeDayId+':'+item.id+':'+hhmm;if(item.time===hhmm&&!fired[key]){fired[key]=true;OPERATOR_STATE.reminders.fired=fired;persistOperator();notify('BTH Operator',item.label+' — time to move.');}});}
function renderPwaStatus(){var el=document.getElementById('pwa-status');if(!el)return;var installed=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone,perm=('Notification'in window)?Notification.permission:'unsupported';el.textContent=(installed?'Installed':'Browser mode')+' · reminders '+perm+' · active day '+OPERATOR_STATE.activeDayId;}
function setupPWA(){if('serviceWorker'in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('./bth-operator-sw.js').catch(function(err){console.warn('Operator service worker unavailable',err);});}
function enhanceControls(root){(root||document).querySelectorAll('[onclick]:not(button):not([role="button"])').forEach(function(el){el.setAttribute('role','button');el.setAttribute('tabindex','0');});}
document.addEventListener('keydown',function(event){if((event.key==='Enter'||event.key===' ')&&event.target.matches('[role="button"]')){event.preventDefault();event.target.click();}});
new MutationObserver(function(){enhanceControls(document);}).observe(document.body,{childList:true,subtree:true});
setupPWA();reminderTick();setInterval(reminderTick,60000);renderToday();enhanceControls(document);
</script>
</body>
